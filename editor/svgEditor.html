<canvas id="canvas"></canvas>
<style>
    #canvas{
    position:absolute;
    top:0;
    left:0;
    background: #303030;
}

body{
    background: white;
}

#control-panel{
    position:absolute;
    left:70%;
    top:0;
    padding: 2%;
    font-family: sans-serif;
}

button{
    border:none;
    text-transform: uppercase;
}
#buttons button{
    background-color: thistle;
    margin: 2px;
    border:1px solid black;
}
#buttons button.active{
    background: coral;
}

textarea{
    width: 100%;
    height: 20vh;
    resize: none;
    outline: none;
}

a{
    position: absolute;
    bottom: -100;
    left: 50%;
    transform: translateX(-50%);
    color: tomato;
    text-transform: uppercase;
}

//resize the canvas
window.onresize = () => {
  canvas.width = window.innerWidth*0.7;
  canvas.height = window.innerHeight;
}

function RandomRange(min=0, max=1, f = 0) {
  r = Math.random() * (max - min) + min
  return f ? Math.floor(r) : r
}

function noActive(){
    for(let j =0; j<assets.length; j++){
        buttons.children[j].className = ""
    }
}

function draw(){
    angle+=5;
    canvas.width ^=0
    drawAsset(JSON.parse(editor.value))
}

function drawAsset(data){
    let s = scale ? (canvas.width/2/(currentAsset.w > currentAsset.h ? currentAsset.w : currentAsset.h)) : 1
    ctx.save()
    ctx.translate(canvas.width/2,canvas.height/2)
    ctx.strokeStyle = "red"
    if(spin)ctx.rotate(angle*Math.PI/180)
    svg(data,[-currentAsset.w/2*s,-currentAsset.h/2*s,s,s])
    if(boundingBoxes)ctx.strokeRect(-currentAsset.w/2*s,-currentAsset.h/2*s,currentAsset.w*s,currentAsset.h*s)
    ctx.restore()
}

function spawnButtons(){
    for(let i = 0; i<assets.length;i++){
        let buttons = document.getElementById("buttons")

        let button =  document.createElement("button")
        button.innerHTML = assets[i].title
        button.setAttribute('onclick',`switchAsset(${i})` )

        buttons.appendChild(button)
    }
}

function switchAsset(i){
    editor.value = JSON.stringify(assets[i].svg)
    currentAsset = assets[i]
    h.value = currentAsset.h
    w.value = currentAsset.w
    noActive()
    buttons.children[i].className = "active"
    title.value = currentAsset.title;
}

function save() {
    let newAsset = {
        svg:JSON.parse(editor.value),
        w:currentAsset.w,
        h:currentAsset.h,
        title:title.value
    }
    console.log(newAsset)
    assets.push(newAsset)
    buttons.innerHTML = ""
    spawnButtons()
    switchAsset(assets.length-1)
}

function exportAsset() {
    let asset = {
        svg:JSON.parse(editor.value),
        w:currentAsset.w,
        h:currentAsset.h,
    }
    let t = title.value
    alert("Artwork SVG code: \n\n"+JSON.stringify(asset)+" //"+t)
}

function deleteAsset(){
    for(let j =0; j<assets.length; j++){
        if(buttons.children[j].className == "active"){
            buttons.innerHTML = ""
            assets.splice(j,1)
            spawnButtons()
            break;
        }
    }
}


function loop(){
    draw()
    window.requestAnimationFrame(loop)
}

/**
 * Main SVG-like drawing function
 * @param {string} t - The instruction data string (e.g., "c red 1, r 0 0 10 10 1 0,")
 * @param {Array} e - Transformation array [xPos, yPos, xScale, yScale]
 */
function svg(t, e) {
  // Save current context and apply initial transformations
  ctx.save();
  ctx.translate(e[0], e[1]);
  ctx.scale(e[2], e[3]);

  var a = t.split(" "); // Split the instruction string into parts

  // Iterate through the instruction string character by character
  while (a.length > 0) {
    var c = a[0]; // Current command character
    var path = new Path2D(); // Initialize a new path for potential path commands
    var fill_stroke = "00";
    //var a = t.slice(i + 2, t.length-1).split(" "); // Parse the arguments for this command

    if (c == "p") {
        
        let i = a.join(" ")
        path = new Path2D(i.slice(2, i.indexOf(":")));
        a = i.slice(i.indexOf(":") + 1).trim().split(" ");
        fill_stroke = a[0];

    } else if (c == "w") {
      // Line Width
      ctx.lineWidth = a[1];

    } else if (c == "g") {
      // Global Alpha (Transparency)
      ctx.globalAlpha = a[1];

    } else if (c == "s") {
      // Shadow Blur (scaled based on the X scale of the drawing)
      ctx.shadowBlur = a[1] * Math.abs(e[2]);

    } else if (c == "c") {
      // Color Command: [color, fillBool, strokeBool, shadowBool]
      if (a[2][0] == "1") ctx.fillStyle = a[1];
      if (a[2][1] == "1") ctx.strokeStyle = a[1];
      if (a[2][2] == "1") ctx.shadowColor = a[1];
      // Skip the index forward past the color string length
      a.shift();

    } else if (c == "a") {
      // Arc Command: [x, y, radius, startAngle, endAngle, fill, stroke]
      path.arc(a[1], a[2], a[3], a[4] * 0.01745, a[5] * 0.01745);
      fill_stroke = a[6];

    } else if (c == "r") {
      // Rect Command: [x, y, width, height, fill, stroke]
      path.rect(a[1], a[2], a[3], a[4]);
      fill_stroke = a[5];

    } else if (c == "<") {
      // Save state
      ctx.save();

    } else if (c == ">") {
      // Restore state
      ctx.restore();

    } else if (c == "t") {
      // Translate
      ctx.translate(a[1], a[2]);

    } else if (c == "q") {
      // Rotate (converts degrees to radians)
      ctx.rotate(a[1] * 0.01745);
    }

    a.shift();
    if (fill_stroke[0] == "1") ctx.fill(path);
    if (fill_stroke[1] == "1") ctx.stroke(path);
  }

  // Final restore to clean up the initial translate/scale
  ctx.restore();
}
